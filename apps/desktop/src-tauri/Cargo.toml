[package]
name = "doze"
version = "0.1.0"
description = "A lightweight utility for a better bedtime."
authors = ["Doze"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "doze_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Accessibility", "Win32_Foundation", "Win32_UI_Controls", "Win32_System_Time", "Win32_System_Power", "Win32_System_Shutdown", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Com", "Win32_System_Registry", "Win32_Security", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem", "implement"] }

windows-core = "0.58"
