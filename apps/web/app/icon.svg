<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="moon" x1="0.15" y1="0.1" x2="0.75" y2="1">
      <stop offset="0" stop-color="#8f7cff"/>
      <stop offset="1" stop-color="#4a36d1"/>
    </linearGradient>
    <mask id="crescent">
      <circle cx="540" cy="520" r="420" fill="#fff"/>
      <circle cx="747" cy="369" r="350" fill="#000"/>
    </mask>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1e1a5c" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect width="1024" height="1024" fill="url(#moon)" mask="url(#crescent)"/>
  </g>
</svg>
