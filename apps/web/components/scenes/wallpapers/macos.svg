<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161735"/>
      <stop offset="0.3" stop-color="#2f2a5c"/>
      <stop offset="0.52" stop-color="#7d4a78"/>
      <stop offset="0.66" stop-color="#d4736f"/>
      <stop offset="0.76" stop-color="#f39a6b"/>
      <stop offset="0.84" stop-color="#f8c48c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.6" cy="0.72" r="0.5">
