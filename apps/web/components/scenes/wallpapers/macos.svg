      <stop offset="0.25" stop-color="#ffb37e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff8f7a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
