      <stop offset="1" stop-color="#ffbe7d"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc79a" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#ffc79a" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffc79a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="h1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d77a7c"/><stop offset="1" stop-color="#b9637a"/></linearGradient>
    <linearGradient id="h2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a5577a"/><stop offset="1" stop-color="#7f456e"/></linearGradient>
    <linearGradient id="h3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6e3d6c"/><stop offset="1" stop-color="#4c2e5c"/></linearGradient>
    <linearGradient id="h4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f2b57"/><stop offset="1" stop-color="#2a2045"/></linearGradient>
