name: Bug report
description: Report a reproducible problem with Doze.
title: "Bug: "
body:
  - type: markdown
    attributes:
      value: >
        Please do not include passwords, access tokens, signing keys, or private
        logs. Report security vulnerabilities privately using the link in
        SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Tell us what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: 1. Open Doze…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Doze version
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - Windows 11
        - macOS 26
        - macOS 15
        - macOS 14
        - macOS 13
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove personal information before sharing.
    validations:
      required: false
