name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create draft and generated release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; reusing it."
          else
            gh release create "$TAG" --verify-tag --draft --generate-notes
          fi

  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            artifact: Doze-windows-x64-setup.exe
            artifact_path: apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/Doze-windows-x64-setup.exe
          - platform: macos
            os: macos-26
            artifact: Doze-macos-universal.dmg
            artifact_path: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/Doze-macos-universal.dmg
    needs: create-release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'x86_64-pc-windows-msvc' }}
      - uses: actions/setup-dotnet@v4
        if: matrix.platform == 'windows'
        with:
          dotnet-version: 8.0.x
      - uses: apple-actions/import-codesign-certs@v3
        if: matrix.platform == 'macos'
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Write notarization API key
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build release installer
        run: pnpm release --build-only
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-installer
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  publish:
    name: Upload installers and publish release
    needs: [create-release, build]
    runs-on: ubuntu-latest
    outputs:
      mac_sha256: ${{ steps.checksums.outputs.mac }}
      windows_sha256: ${{ steps.checksums.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - id: checksums
        name: Calculate installer checksums
        shell: bash
        run: |
          echo "mac=$(sha256sum installers/Doze-macos-universal.dmg | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "windows=$(sha256sum installers/Doze-windows-x64-setup.exe | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Upload both installers and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" installers/Doze-windows-x64-setup.exe installers/Doze-macos-universal.dmg --clobber
          gh release edit "$TAG" --draft=false

  publish-homebrew:
    name: Update Homebrew tap
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: fayeed/homebrew-tap
          ref: main
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Generate cask and update tap
        env:
          VERSION: ${{ github.ref_name }}
          MAC_SHA256: ${{ needs.publish.outputs.mac_sha256 }}
        shell: bash
        run: |
          VERSION="${VERSION#v}"
          mkdir -p /tmp/doze-manifests
          node scripts/package-manifests.mjs "$VERSION" "$MAC_SHA256" "${{ needs.publish.outputs.windows_sha256 }}" /tmp/doze-manifests
          mkdir -p homebrew-tap/Casks
          cp "/tmp/doze-manifests/$VERSION/doze.rb" homebrew-tap/Casks/doze.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/doze.rb
          if ! git diff --cached --quiet; then
            git commit -m "Update Doze to $VERSION"
            git push origin main
          fi

  publish-winget:
    name: Submit WinGet manifests
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate manifests
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
          MAC_SHA256: ${{ needs.publish.outputs.mac_sha256 }}
          WINDOWS_SHA256: ${{ needs.publish.outputs.windows_sha256 }}
        run: |
          $version = $env:VERSION.TrimStart('v')
          node scripts/package-manifests.mjs $version $env:MAC_SHA256 $env:WINDOWS_SHA256 "$env:RUNNER_TEMP/doze-manifests"
          $manifest = "$env:RUNNER_TEMP/doze-manifests/$version"
          $wingetPath = "$env:RUNNER_TEMP/winget/manifests/f/Fayeed/Doze/$version"
          New-Item -ItemType Directory -Force -Path $wingetPath | Out-Null
          Get-ChildItem $manifest -Filter 'Fayeed.Doze*.yaml' | Copy-Item -Destination $wingetPath
      - name: Submit to the WinGet community repository
        shell: pwsh
        env:
          WINGET_SUBMISSION_TOKEN: ${{ secrets.WINGET_SUBMISSION_TOKEN }}
          GH_TOKEN: ${{ secrets.WINGET_SUBMISSION_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          if (-not $env:WINGET_SUBMISSION_TOKEN) { throw 'Configure WINGET_SUBMISSION_TOKEN to publish WinGet manifests.' }
          $version = $env:VERSION.TrimStart('v')
          $mergedPath = "repos/microsoft/winget-pkgs/contents/manifests/f/Fayeed/Doze/$version"
          gh api $mergedPath *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "WinGet $version is already published."; exit 0 }
          $openPullRequests = gh pr list --repo microsoft/winget-pkgs --state open --limit 100 --search "Fayeed.Doze $version" --json number --jq 'length'
          if ($openPullRequests -and [int]$openPullRequests -gt 0) { Write-Host "WinGet submission for $version is already open."; exit 0 }
          winget install --id Microsoft.WingetCreate --exact --silent --accept-source-agreements --accept-package-agreements
          wingetcreate submit --token $env:WINGET_SUBMISSION_TOKEN "$env:RUNNER_TEMP/winget/manifests/f/Fayeed/Doze"
