name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - v0.2.0

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: 8.0.x
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build native companions
        run: pnpm --filter @doze/desktop native:build
      - name: Check app version declarations
        run: node scripts/version-check.mjs
      - name: Check tray panel types
        run: pnpm --filter @doze/desktop panel:check
      - name: Build tray panel
        run: pnpm --filter @doze/desktop panel:build
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build website
        run: pnpm build:web
      - name: Check release packaging metadata
        run: pnpm release:test
